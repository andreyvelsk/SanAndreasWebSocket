name: Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

env:
  VCPKG_COMMIT: "77df67cfff9c12ccfdb52284e07c87c75092f723"
  VCPKG_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-binary-cache
  VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-binary-cache,readwrite"
  VCPKG_FEATURE_FLAGS: "manifests,binarycaching"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC (x86)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_x86

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}

      - name: Compute vcpkg cache key
        id: vcpkg-cache
        shell: pwsh
        run: |
          $parts = @(
            "vs$env:VSCMD_VER",
            "msvc$env:VCToolsVersion",
            "sdk$env:WindowsSDKVersion"
          )
          $toolchain = $parts -join "-"
          echo "toolchain=$toolchain" >> $env:GITHUB_OUTPUT

      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-x86-windows-static-${{ env.VCPKG_COMMIT }}-${{ steps.vcpkg-cache.outputs.toolchain }}-${{ hashFiles('vcpkg.json', 'CMakePresets.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-x86-windows-static-${{ env.VCPKG_COMMIT }}-${{ steps.vcpkg-cache.outputs.toolchain }}-

      - name: Prepare vcpkg binary cache
        run: cmake -E make_directory "${{ env.VCPKG_BINARY_CACHE }}"

      - name: Configure CMake
        run: cmake --preset release

      - name: Build
        run: cmake --build build/release --config Release

      - name: Upload ASI artifact
        uses: actions/upload-artifact@v4
        with:
          name: SanAndreasWebSocket-${{ github.sha }}
          path: build/release/SanAndreasWebSocket.asi
          if-no-files-found: error
