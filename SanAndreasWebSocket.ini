[WebSocket]
; Адрес для прослушивания:
;   0.0.0.0   — все интерфейсы (LAN + localhost)
;   127.0.0.1 — только локально (только этот ПК)
;   192.168.x.x — конкретный сетевой интерфейс
host=0.0.0.0

; Порт WebSocket-сервера
port=8765

[Debug]
; Включить детальный лог в файл SanAndreasWebSocket.log (рядом с .asi)
; 0 — выключен (по умолчанию), 1 — включён
log_trace=0
